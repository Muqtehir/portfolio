<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Muqtehir Mayaleeke — Open Graph Image Template</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
      }

      body {
        display: grid;
        place-items: center;
        color: #f4f3ff;
        background:
          radial-gradient(ellipse at 15% 8%, rgba(139, 92, 246, 0.24), transparent 40%),
          radial-gradient(ellipse at 95% 90%, rgba(34, 211, 238, 0.18), transparent 42%),
          #07080f;
        font-family: Inter, "Segoe UI", Arial, sans-serif;
      }

      .frame {
        position: relative;
        display: flex;
        width: 1120px;
        height: 550px;
        flex-direction: column;
        justify-content: center;
        padding: 76px 82px;
        overflow: hidden;
        border: 1px solid rgba(196, 167, 255, 0.22);
        border-radius: 34px;
        background:
          linear-gradient(135deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.018)),
          rgba(13, 16, 26, 0.8);
        box-shadow: 0 36px 110px rgba(0, 0, 0, 0.4);
      }

      .frame::before {
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(115deg, transparent 24%, rgba(139, 92, 246, 0.12), transparent 72%);
        content: "";
        pointer-events: none;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 18px;
        color: #c2c1d2;
        font-size: 18px;
        font-weight: 650;
        letter-spacing: 0.11em;
        text-transform: uppercase;
      }

      .monogram {
        display: grid;
        width: 58px;
        height: 58px;
        place-items: center;
        border: 1px solid rgba(196, 167, 255, 0.3);
        border-radius: 18px;
        color: #f4f3ff;
        background: linear-gradient(135deg, rgba(139, 92, 246, 0.28), rgba(34, 211, 238, 0.18));
        font-size: 22px;
        font-weight: 800;
      }

      h1 {
        margin: 46px 0 18px;
        font-size: 68px;
        font-weight: 750;
        letter-spacing: -0.065em;
        line-height: 1.04;
      }

      .role {
        width: fit-content;
        margin: 0;
        color: #d9d3ff;
        background: linear-gradient(100deg, #c4a7ff, #67e8f9);
        background-clip: text;
        font-size: 32px;
        font-weight: 650;
        letter-spacing: -0.03em;
        -webkit-text-fill-color: transparent;
      }

      .rule {
        width: 150px;
        height: 4px;
        margin-top: 42px;
        border-radius: 99px;
        background: linear-gradient(90deg, #8b5cf6, #22d3ee);
      }

      .orb {
        position: absolute;
        right: 80px;
        bottom: 75px;
        width: 170px;
        height: 170px;
        border: 1px solid rgba(196, 167, 255, 0.3);
        border-radius: 50%;
        background: radial-gradient(circle at 32% 28%, rgba(196, 167, 255, 0.3), rgba(34, 211, 238, 0.07) 66%, transparent 68%);
        box-shadow: 0 0 75px rgba(139, 92, 246, 0.2), inset 0 0 40px rgba(34, 211, 238, 0.12);
      }

      .orb::after {
        position: absolute;
        inset: 17px;
        border: 1px solid rgba(34, 211, 238, 0.45);
        border-radius: inherit;
        content: "";
      }
    </style>
  </head>
  <body>
    <main class="frame">
      <div class="brand">
        <span class="monogram" aria-hidden="true">M.</span>
        <span>Portfolio</span>
      </div>
      <h1>Muqtehir Mayaleeke</h1>
      <p class="role">Full-Stack Developer</p>
      <span class="rule" aria-hidden="true"></span>
      <span class="orb" aria-hidden="true"></span>
    </main>
  </body>
</html>
