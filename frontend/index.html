    <style>
      html[data-intro="on"]::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 9990;
        background: #05060c;
      }
    </style>
    <script>
      (function () {
        try {
          var seen = sessionStorage.getItem("introSeen");
          var deep = location.hash.length > 1 || location.pathname !== "%BASE_URL%";
          var enabled = !seen && !deep;
          if (enabled) {
            document.documentElement.setAttribute("data-intro", "on");
            setTimeout(function () {
              document.documentElement.removeAttribute("data-intro");
            }, 9000);
          }
        } catch (e) {}
      })();
    </script>
    <script>
      (() => {
        const root = document.documentElement;
        const brands = navigator.userAgentData?.brands;
        const userAgent = navigator.userAgent;
        const isIOS = /iPad|iPhone|iPod/.test(userAgent);
        const hasChromiumBrand = brands?.some(({ brand }) => brand.includes("Chromium"));
        const isChromium = hasChromiumBrand ??
          (!isIOS && /(?:Chromium|Chrome|Edg|OPR)\//.test(userAgent));
        if (isChromium) root.classList.add("lg-refract");

        const systemTheme = window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
        try {
          const savedTheme = window.localStorage.getItem("portfolio-theme");
          root.dataset.theme =
            savedTheme === "light" || savedTheme === "dark" ? savedTheme : systemTheme;
        } catch (error) {
          console.warn("Could not read the saved theme preference:", error);
          root.dataset.theme = systemTheme;
        }
        const themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) {
          themeColor.setAttribute(
            "content",
            root.dataset.theme === "dark" ? "#07080f" : "#f6f2e9",
          );
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="intro-root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
